        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
        }

        .auth-container {
            width: min(480px, 100%);
        }

        .auth-header {
            margin-bottom: 42px;
        }

        .auth-header .eyebrow {
            margin-bottom: 18px;
        }

        .auth-header h1 {
            margin: 0 0 18px;
        }

        .auth-header p {
            margin: 0;
            line-height: 1.6;
            opacity: 0.7;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .auth-field label {
            font-size: 0.9rem;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px 18px;
            border: 1px solid rgba(0, 0, 0, 0.16);
            border-radius: 12px;
            background: #fff;
            font: inherit;
            outline: none;
        }

        .auth-field input:focus {
            border-color: rgba(0, 0, 0, 0.45);
        }

        .auth-submit {
            width: 100%;
            margin-top: 8px;
            border: 0;
            cursor: pointer;
            font: inherit;
        }

        .auth-submit:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .auth-message {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.92rem;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.error {
            background: #f8eaea;
            color: #8b2d2d;
        }

        .auth-message.success {
            background: #eaf5ec;
            color: #28633a;
        }

        .auth-links {
            margin-top: 30px;
            text-align: center;
        }

        .auth-links p {
            margin: 0;
            opacity: 0.7;
        }

        .auth-links a {
            color: inherit;
            font-weight: 600;
        }

        .auth-forgot {
            display: block;
            margin-top: 14px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 600px) {

            .auth-main {
                padding: 60px 20px;
                align-items: flex-start;
            }

            .auth-container {
                padding-top: 30px;
            }

        }
    </style>
</head>

<body class="auth-page">

    <header class="navbar">

        <a href="./index.html" class="logo">
            unera<span>.</span>
        </a>

        <nav>

            <a href="./page2.html">
                Descobrir
            </a>

            <a href="./login.html" class="active">
                O meu perfil
            </a>

            <a href="./ajuda.html">
                Ajuda
            </a>

        </nav>

    </header>

    <main class="auth-main">

        <section class="auth-container">

            <div class="auth-header">

                <p class="eyebrow">
                    O MEU PERFIL
                </p>

                <h1>
                    Bem-vinda/o<br>
                    de volta.
                </h1>

                <p>
                    Entra na tua conta para continuares
                    a tua university era.
                </p>

            </div>

            <form
                id="loginForm"
                class="auth-form"
            >

                <div class="auth-field">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="O teu email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="loginPassword">
                        Palavra-passe
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="A tua palavra-passe"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="dark-button auth-submit"
                >

                    Entrar

                    <span>
                        ↗
                    </span>

                </button>

            </form>

            <div
                id="loginMessage"
                class="auth-message"
                role="alert"
            ></div>

            <div class="auth-links">

                <p>

                    Ainda não tens conta?

                    <a href="./registo.html">
                        Criar conta
                    </a>

                </p>

                <a
                    href="#"
                    id="forgotPasswordLink"
                    class="auth-forgot"
                >
                    Esqueceste-te da palavra-passe?
                </a>

            </div>

        </section>

    </main>

    <footer>

        <p>
            unera<span>.</span>
        </p>

        <span>
            your university era.
        </span>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./supabase-config.js"></script>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const loginForm =
                    document.getElementById("loginForm");

                const loginEmail =
                    document.getElementById("loginEmail");

                const loginPassword =
                    document.getElementById("loginPassword");

                const loginButton =
                    document.getElementById("loginButton");

                const loginMessage =
                    document.getElementById("loginMessage");

                const forgotPasswordLink =
                    document.getElementById("forgotPasswordLink");


                if (
                    typeof uneraSupabase === "undefined"
                ) {

                    console.error(
                        "UNERA: Supabase não foi carregado."
                    );

                    mostrarMensagem(
                        "O serviço de autenticação não está disponível. Tenta atualizar a página.",
                        "error"
                    );

                    return;

                }


                function mostrarMensagem(
                    texto,
                    tipo
                ) {

                    loginMessage.textContent =
                        texto;

                    loginMessage.className =
                        "auth-message show " +
                        tipo;

                }


                function esconderMensagem() {

                    loginMessage.textContent =
                        "";

                    loginMessage.className =
                        "auth-message";

                }


                function traduzirErro(
                    mensagem
                ) {

                    const erro =
                        String(
                            mensagem || ""
                        ).toLowerCase();


                    if (
                        erro.includes(
                            "invalid login credentials"
                        ) ||
                        erro.includes(
                            "invalid credentials"
                        )
                    ) {

                        return (
                            "O email ou a palavra-passe estão incorretos."
                        );

                    }


                    if (
                        erro.includes(
                            "email not confirmed"
                        )
                    ) {

                        return (
                            "Ainda precisas de confirmar o teu email antes de iniciar sessão."
                        );

                    }


                    if (
                        erro.includes(
                            "too many requests"
                        )
                    ) {

                        return (
                            "Foram feitas demasiadas tentativas. Aguarda um pouco e tenta novamente."
                        );

                    }


                    if (
                        erro.includes("network") ||
                        erro.includes("fetch")
                    ) {

                        return (
                            "Não foi possível contactar o servidor. Verifica a tua ligação à internet."
                        );

                    }


                    return (
                        "Não foi possível iniciar sessão. Verifica os teus dados e tenta novamente."
                    );

                }


                loginForm.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();

                        esconderMensagem();

                        const email =
                            loginEmail.value.trim();

                        const password =
                            loginPassword.value;


                        if (
                            !email ||
                            !password
                        ) {

                            mostrarMensagem(
                                "Preenche o email e a palavra-passe para continuar.",
                                "error"
                            );

                            return;

                        }


                        loginButton.disabled =
                            true;

                        loginButton.innerHTML =
                            "A entrar...";


                        try {

                            const {
                                data,
                                error
                            } =
                                await uneraSupabase
                                    .auth
                                    .signInWithPassword({

                                        email:
                                            email,

                                        password:
                                            password

                                    });


                            if (error) {

                                console.error(
                                    "UNERA LOGIN:",
                                    error
                                );

                                mostrarMensagem(
                                    traduzirErro(
                                        error.message
                                    ),
                                    "error"
                                );

                                loginButton.disabled =
                                    false;

                                loginButton.innerHTML =
                                    'Entrar <span>↗</span>';

                                return;

                            }


                            if (
                                !data ||
                                !data.session ||
                                !data.user
                            ) {

                                mostrarMensagem(
                                    "Não foi possível iniciar sessão. Tenta novamente.",
                                    "error"
                                );

                                loginButton.disabled =
                                    false;

                                loginButton.innerHTML =
                                    'Entrar <span>↗</span>';

                                return;

                            }


                            /*
                             * A alteração importante:
                             *
                             * O login já devolveu uma sessão válida.
                             * Não fazemos getSession() novamente aqui.
                             * Não fazemos signOut().
                             * Não esperamos outro evento.
                             *
                             * A sessão já foi guardada pelo Supabase.
                             */

                            mostrarMensagem(
                                "Sessão iniciada. A entrar no teu perfil...",
                                "success"
                            );


                            /*
                             * Damos apenas tempo suficiente para o
                             * Supabase terminar de persistir a sessão.
                             */

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "./perfil.html";

                                },
                                500
                            );


                        } catch (error) {

                            console.error(
                                "UNERA LOGIN ERROR:",
                                error
                            );

                            mostrarMensagem(
                                "Ocorreu um erro ao iniciar sessão. Tenta novamente.",
                                "error"
                            );

                            loginButton.disabled =
                                false;

                            loginButton.innerHTML =
                                'Entrar <span>↗</span>';

                        }

                    }
                );


                forgotPasswordLink.addEventListener(
                    "click",
                    async function (event) {

                        event.preventDefault();

                        const email =
                            loginEmail.value.trim();


                        if (!email) {

                            mostrarMensagem(
                                'Escreve primeiro o teu email e depois seleciona "Esqueceste-te da palavra-passe?".',
                                "error"
                            );

                            loginEmail.focus();

                            return;

                        }


                        forgotPasswordLink.textContent =
                            "A enviar...";


                        try {

                            const {
                                error
                            } =
                                await uneraSupabase
                                    .auth
                                    .resetPasswordForEmail(
                                        email,
                                        {
                                            redirectTo:
                                                window.location.origin +
                                                "/login.html"
                                        }
                                    );


                            if (error) {

                                console.error(
                                    "UNERA PASSWORD RESET:",
                                    error
                                );

                                mostrarMensagem(
                                    "Não foi possível enviar o email de recuperação. Tenta novamente.",
                                    "error"
                                );

                            } else {

                                mostrarMensagem(
                                    "Enviámos um email de recuperação. Verifica a tua caixa de entrada.",
                                    "success"
                                );

                            }

                        } catch (error) {

                            console.error(
                                "UNERA PASSWORD RESET:",
                                error
                            );

                            mostrarMensagem(
                                "Ocorreu um erro. Tenta novamente.",
                                "error"
                            );

                        } finally {

                            forgotPasswordLink.textContent =
                                "Esqueceste-te da palavra-passe?";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
